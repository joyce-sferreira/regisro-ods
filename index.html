
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ações Culturais</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    google.charts.load('current', { packages: ['table'] });
    google.charts.setOnLoadCallback(drawTable);

    function drawTable() {
      var queryString = encodeURIComponent('SELECT A, B, C, D, E');
      var dataSourceUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCzWfkIZ9gkn0Z6YZICKv-zPDi2wFTmPOD7g0EK6d2HVQcsQK60GA3GHmQfojpxFyRwsu2xbqcmQOC/gviz/tq?sheet=Página1&range=A1:E1000&headers=1&tq=' + queryString;

      var query = new google.visualization.Query(dataSourceUrl);
      query.send(function (response) {
        var data = response.getDataTable();
        var table = new google.visualization.Table(document.getElementById('table_div'));
        table.draw(data, { showRowNumber: true, width: '100%', height: '100%' });
      });
    }
  </script>
</head>
<body>
  <h2>Ações Registradas</h2>
  <div id="table_div"></div>
</body>
</html>

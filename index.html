
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Registro de Ações - ODS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: 0 auto 30px;
      background: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 15px;
      background-color: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #table_div {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Programa de Ação Cultural - ODS</h1>

  <form id="form-registro" onsubmit="enviarFormulario(event)">
    <label>Título da Ação</label>
    <input type="text" name="titulo" required />

    <label>Escola</label>
    <input type="text" name="escola" required />

    <label>Data</label>
    <input type="date" name="data" required />

    <label>Descrição</label>
    <textarea name="descricao" required></textarea>

    <label>ODS Relacionada</label>
    <select name="ods" required>
      <option value="">Selecione</option>
      <option value="ODS 3 - Saúde e bem-estar">ODS 3 - Saúde e bem-estar</option>
      <option value="ODS 4 - Educação de qualidade">ODS 4 - Educação de qualidade</option>
      <option value="ODS 5 - Igualdade de gênero">ODS 5 - Igualdade de gênero</option>
      <option value="ODS 10 - Redução das desigualdades">ODS 10 - Redução das desigualdades</option>
      <option value="ODS 11 - Cidades e comunidades sustentáveis">ODS 11 - Cidades e comunidades sustentáveis</option>
    </select>

    <button type="submit">Registrar Ação</button>
  </form>

  <h2>Ações Registradas</h2>
  <div id="table_div"></div>

  <script>
    // EXIBIR OS DADOS DA PLANILHA
    google.charts.load('current', { packages: ['table'] });
    google.charts.setOnLoadCallback(drawTable);

    function drawTable() {
      const query = new google.visualization.Query(
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCzWfkIZ9gkn0Z6YZICKv-zPDi2wFTmPOD7g0EK6d2HVQcsQK60GA3GHmQfojpxFyRwsu2xbqcmQOC/gviz/tq?sheet=Página1'
      );
      query.send(response => {
        const data = response.getDataTable();
        const table = new google.visualization.Table(document.getElementById('table_div'));
        table.draw(data, { showRowNumber: true, width: '100%' });
      });
    }

    // ENVIO (simulado — para funcionar real precisa de Google Apps Script)
    function enviarFormulario(event) {
      event.preventDefault();
      alert("Envio simulado. Para gravar na planilha, é necessário configurar o Google Apps Script.");
      event.target.reset();
    }
  </script>
</body>
</html>
